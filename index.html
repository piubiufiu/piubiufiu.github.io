<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<title>工具</title>
<style>
:root{
 --bg:#f6f3ec; --paper:#fffdf8; --ink:#1e232b; --ink2:#5b6572; --line:#e2dcd0;
 --accent:#8c2b22; --ok:#2f6b4f; --shadow:0 1px 2px rgba(30,35,43,.06),0 8px 24px rgba(30,35,43,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);min-height:100vh;
 font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;
 -webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:56px 16px 40px}
h1{margin:0 0 6px;font-size:24px;letter-spacing:1px}
.lead{margin:0 0 22px;font-size:13px;color:var(--ink2);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);
 border-radius:16px;padding:20px 20px 18px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-2px);border-color:#d3caba}
.card .k{font-size:11px;letter-spacing:2px;color:#9a927f}
.card h2{margin:8px 0 6px;font-size:19px;letter-spacing:.5px}
.card p{margin:0;font-size:13px;color:var(--ink2);line-height:1.7}
.card .go{margin-top:14px;font-size:12px;color:var(--accent);font-weight:600}
.note{margin-top:26px;font-size:12px;color:#9a927f;line-height:1.8}
.note b{color:var(--ink2);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>工具</h1>
  <p class="lead">两个离线可用的小工具。页面本身不带账号信息，进度只存在你自己的浏览器里。</p>
  <div class="grid">
    <a class="card" href="./k7m2q/">
      <div class="k">NOTES</div>
      <h2>背诵进度（加密）</h2>
      <p>按篇记录复习节点与首背日，本机保存；需要跨设备时在页面里手动同步。</p>
      <div class="go">打开 →</div>
    </a>
    <a class="card" href="./ebbinghaus/">
      <div class="k">PLANNER</div>
      <h2>艾宾浩斯计划表</h2>
      <p>自定义背诵周期，生成复习计划表，可打印或导出 PDF。</p>
      <div class="go">打开 →</div>
    </a>
  </div>
  <p class="note"><b>说明：</b>两个入口都是单页工具，打开即可用；计划表生成器依赖在线 CDN，断网时部分样式可能缺失。本站不收集任何数据。</p>
</div>
</body>
</html>
